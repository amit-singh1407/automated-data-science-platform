services:
  backend:
    build: ./backend
    container_name: autodata-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    environment:
      - AUTODATA_SQLITE_PATH=autodata.db
      - AUTODATA_UPLOADS_ROOT=uploads
      - AUTODATA_SECRET_KEY=replace-this-for-production
  frontend:
    build: ./frontend
    container_name: autodata-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
